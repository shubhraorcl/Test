name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Resolve latest Fabric versions for 1.21.11
        run: |
          MC=1.21.11
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
            | grep -oP "<version>\K[^<]*\+${MC//./\\.}(?=</version>)" | tail -1)
          echo "yarn=$YARN loader=$LOADER fabric-api=$FAPI"
          echo "VERSION_ARGS=-Pyarn_mappings=$YARN -Ploader_version=$LOADER -Pfabric_version=$FAPI" >> "$GITHUB_ENV"
      - run: gradle build $VERSION_ARGS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hitcue-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
